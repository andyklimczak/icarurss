services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: icarurss
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MIX_ENV: ${MIX_ENV:-prod}
      PORT: ${PORT:-4000}
      PHX_SERVER: "true"
      DATABASE_PATH: ${DATABASE_PATH:-/data/icarurss_prod.db}
      FEED_FETCH_RECEIVE_TIMEOUT_MS: ${FEED_FETCH_RECEIVE_TIMEOUT_MS:-30000}
      MAX_FEED_BYTES: ${MAX_FEED_BYTES:-25000000}
      MAX_ITEMS_PER_FEED: ${MAX_ITEMS_PER_FEED:-500}
      OBAN_PRUNE_MAX_AGE_SECONDS: ${OBAN_PRUNE_MAX_AGE_SECONDS:-21600}
      OBAN_PRUNE_LIMIT: ${OBAN_PRUNE_LIMIT:-500}
      SQLITE_BUSY_TIMEOUT_MS: ${SQLITE_BUSY_TIMEOUT_MS:-15000}
      STALE_FEED_JOB_TIMEOUT_SECONDS: ${STALE_FEED_JOB_TIMEOUT_SECONDS:-3600}
    ports:
      - "${PORT:-4000}:4000"
    volumes:
      - ./data:/data
